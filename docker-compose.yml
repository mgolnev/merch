version: '3.8'

services:
  web:
    build: .
    container_name: merch-web
    ports:
      - "8000:8000"
    volumes:
      - ./merchandise.db:/app/merchandise.db:rw
      - ./logs:/app/logs
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - merch-network

  nginx:
    image: nginx:alpine
    container_name: merch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - merch-network

networks:
  merch-network:
    driver: bridge 